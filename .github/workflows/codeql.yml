name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "22 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: swift
          build-mode: manual
      - name: Build
        run: swift build --target ObjCRuntimeUtilities -v
      - uses: github/codeql-action/analyze@v4.37.9
